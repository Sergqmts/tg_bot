{% extends "base.html" %}
{% block title %}Новый пароль — Vibe{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[var(--accent)] rounded-[6px] flex items-center justify-center text-black text-3xl mx-auto mb-4">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tighter">Новый пароль</h1>
            <p class="text-[var(--text-2)] mt-2 text-sm">Придумай надёжный пароль (минимум 6 символов)</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="mb-4 p-4 rounded-[8px] text-sm" style="background: rgba(255,68,85,0.1); border: 1px solid rgba(255,68,85,0.3); color: var(--danger);">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <div style="background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; padding: 2rem;">
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <input
                        type="password"
                        name="password"
                        required
                        minlength="6"
                        placeholder="Новый пароль"
                        class="w-full bg-[var(--surface-2)] border border-[var(--border-2)] rounded-[8px] py-3 px-4 outline-none focus:ring-2 focus:ring-[var(--accent)] text-sm text-[var(--text)] placeholder:text-[var(--text-3)]"
                    >
                </div>
                <div class="form-group">
                    <input
                        type="password"
                        name="confirm_password"
                        required
                        minlength="6"
                        placeholder="Подтверди пароль"
                        class="w-full bg-[var(--surface-2)] border border-[var(--border-2)] rounded-[8px] py-3 px-4 outline-none focus:ring-2 focus:ring-[var(--accent)] text-sm text-[var(--text)] placeholder:text-[var(--text-3)]"
                    >
                </div>
                <button type="submit" class="w-full py-3 bg-[var(--accent)] text-black rounded-[6px] font-bold text-sm hover:opacity-90 transition-all cursor-pointer">
                    Сохранить пароль
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
